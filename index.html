<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Google Sign-In (GSI + FedCM) + 3</title>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- GSI Config -->
  <div id="g_id_onload"
       data-client_id="791605933783-ehbta9r4ht1pm9pufqevph0ojc18mv7f.apps.googleusercontent.com"
       data-callback="handleCredential"
       data-use_fedcm="false"
       data-auto_prompt="false"
       >
  </div>

  <!-- Google Sign-In Button -->
  <div class="g_id_signin"
       data-type="standard"
       data-size="large"
       data-theme="outline"
       data-text="sign_in_with"
       data-shape="rectangular">
  </div>
  <br/>
<script>
function parseJwt(token) {
  const base64Url = token.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  const jsonPayload = decodeURIComponent(
    atob(base64)
      .split('')
      .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
      .join('')
  );
  return JSON.parse(jsonPayload);
}

function handleCredential(response) {
  // Decode the ID token
  const user = parseJwt(response.credential);

  console.log("User ID:", user.sub);
  console.log("Email:", user.email);
  console.log("Name:", user.name);
  console.log("Picture:", user.picture);

  // Example: show on page
  document.body.innerHTML += `
    <p><b>Name:</b> ${user.name}</p>
    <p><b>Email:</b> ${user.email}</p>
    <img src="${user.picture}" width="80">
  `;
}
console.log("Origin:", window.location.origin);
document.querySelector('#g_id_onload').dataset.client_id

</script>


</body>
</html>
